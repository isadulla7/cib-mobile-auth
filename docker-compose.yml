services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: cib
      POSTGRES_USER: cib
      POSTGRES_PASSWORD: cib_dev_password
    ports: ["5432:5432"]
    volumes: [cib_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cib -d cib"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.0-alpine
    command: ["redis-server","--appendonly","yes","--appendfsync","everysec","--maxmemory-policy","noeviction"]
    ports: ["6379:6379"]
    volumes: [cib_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: { context: ./backend }
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/cib
      DB_USER: cib
      DB_PASSWORD: cib_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  cib_postgres:
  cib_redis:
