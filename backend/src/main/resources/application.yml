spring:
  application:
    name: cib-mobile-auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cib}
    username: ${DB_USER:cib}
    password: ${DB_PASSWORD:cib_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 3000
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    otp-pepper: ${APP_OTP_PEPPER:}
    pin-pepper: ${APP_PIN_PEPPER:}
    device-pepper: ${APP_DEVICE_PEPPER:}
    jwt:
      issuer: ${JWT_ISSUER:cib-mobile-auth}
      audience: ${JWT_AUDIENCE:cib-mobile-app}
      key-id: ${JWT_KEY_ID:cib-auth-key-1}
      private-key-pkcs8-base64: ${JWT_PRIVATE_KEY_PKCS8_B64:}
      public-key-x509-base64: ${JWT_PUBLIC_KEY_X509_B64:}
      allow-ephemeral-keys: false
  mock:
    sms:
      enabled: ${MOCK_SMS_ENABLED:false}
      fixed-otp: ${MOCK_SMS_FIXED_OTP:}
    myid:
      enabled: ${MOCK_MYID_ENABLED:false}
